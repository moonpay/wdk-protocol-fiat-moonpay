name: Publish
on:
  push:
    tags:
      - v*
permissions:
  id-token: write
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: release
    name: Publish
    steps:
      - uses: holepunchto/actions/node-base@6536ea03d3b33366c6a9d1dd9f1e0a328b1cfe8d # v1
      - uses: holepunchto/actions/publish@6536ea03d3b33366c6a9d1dd9f1e0a328b1cfe8d # v1

